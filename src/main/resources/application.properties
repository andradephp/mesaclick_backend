
spring.application.name=mesaclick

# ==========================================
# BASE DE DATOS
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baseclick_bd}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.springframework.security=DEBUG

# ==========================================
# IMAGENES DE PRODUCTOS
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

mesaclick.upload-dir=uploads/productos

# ==========================================
# CORREO ELECTRONICO - MESACLICK
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mesaclick.url-publica=${MESACLICK_URL_PUBLICA:http://localhost:8080}

mesaclick.frontend-url=${MESACLICK_FRONTEND_URL:http://localhost:5173}